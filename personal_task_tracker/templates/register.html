{% extends "base.html" %}
{% block title %}Register | Personal Task Tracker{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>નવું એકાઉન્ટ બનાવો</h1>
  <p class="muted">શરૂ કરવા માટે નીચેની માહિતી ભરો.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="stack">
    <label>Username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
    <label>Password (ઓછામાં ઓછા 8 અક્ષર)<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm Password<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">Register</button>
  </form>
  <p class="muted">પહેલેથી એકાઉન્ટ છે? <a href="/login">Login કરો</a></p>
</section>
{% endblock %}
